name: Windows build

on:
  push:
    branches: [main, master, "Sephira's-Update"]
  pull_request:
  workflow_dispatch:
    inputs:
      build:
        description: Build number to stamp (defaults to 15)
        default: "15"
      cloud_download:
        description: Provide a temporary unpublished download for cloud testing
        type: boolean
        default: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Build
        shell: pwsh
        env:
          APP_BUILD: ${{ inputs.build }}
        run: |
          $build = $env:APP_BUILD
          if (-not $build) { $build = "15" }
          if ($build -notmatch '^\d+$') { throw 'Build number must be a nonnegative integer.' }
          $build = [int]$build
          $manifest = $null
          try {
            $manifest = Invoke-RestMethod -Uri 'https://ffbe.luminest.io/manifest.json' -TimeoutSec 20
          } catch {
            Write-Warning 'The updater manifest is unavailable. Continuing with the requested build number; the app checks compatibility at startup.'
          }
          if ($manifest.minApp -and ([version]"1.0.0.$build" -lt [version]$manifest.minApp)) {
            throw "Build 1.0.0.$build is below the host's minimum app version $($manifest.minApp)."
          }
          flutter build windows --release --build-name 1.0.0 --build-number $build --dart-define=APP_VERSION=1.0.0 --dart-define=APP_BUILD=$build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Rename-Item build/windows/x64/runner/Release/ffr_vision_studio.exe "FFR Vision Studio.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: FFR-Vision-Studio-windows
          path: build/windows/x64/runner/Release/

  cloud-download:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cloud_download }}
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FFR-Vision-Studio-windows
          path: bundle
      - name: Provide an unpublished download copy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, zipfile
          root = pathlib.Path('bundle')
          with zipfile.ZipFile('FFR-Vision-Studio-windows.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(root))
          artifacts = json.loads(subprocess.check_output([
              'gh', 'api', f"repos/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}/artifacts",
          ]))['artifacts']
          artifact, = [a for a in artifacts if a['name'] == 'FFR-Vision-Studio-windows' and not a['expired']]
          provenance = {
              'commit': os.environ['COMMIT_SHA'], 'branch': os.environ['BRANCH'],
              'run_id': int(os.environ['RUN_ID']), 'artifact_id': artifact['id'],
          }
          pathlib.Path('build-provenance.json').write_text(json.dumps(provenance, indent=2))
          PY
          gh release create "cloud-test-$RUN_ID" FFR-Vision-Studio-windows.zip \
            --repo "$REPO" --draft --target "$COMMIT_SHA" \
            --title "Temporary cloud test build (run $RUN_ID)" --notes-file build-provenance.json
